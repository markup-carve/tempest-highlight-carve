name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse
        if: matrix.php-version == '8.4'
      - run: vendor/bin/phpcs
        if: matrix.php-version == '8.4'
